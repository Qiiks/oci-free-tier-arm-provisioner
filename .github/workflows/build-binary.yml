name: Build Linux Binary
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Commit Linux binary
        run: |
          mkdir -p bin
          cp target/release/oci-free-tier-arm bin/oci-free-tier-arm-linux
          chmod +x bin/oci-free-tier-arm-linux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/oci-free-tier-arm-linux
          if git diff --cached --quiet; then
            echo "binary unchanged — nothing to commit"
          else
            git commit -m "build: commit Linux release binary"
            git push
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t oci-provisioner:test .

      - name: Smoke test — must fail fast without credentials
        run: |
          set +e
          out=$(docker run --rm oci-provisioner:test 2>&1)
          code=$?
          set -e
          echo "exit=$code"
          echo "$out"
          [ "$code" -eq 1 ] || { echo "FAIL: expected exit 1 without credentials"; exit 1; }
          [ -n "$out" ] || { echo "FAIL: expected an error message on stderr/stdout"; exit 1; }
