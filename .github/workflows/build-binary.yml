name: Build Linux Binary
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Commit Linux binary
        run: |
          mkdir -p bin
          cp target/release/oci-free-tier-arm bin/oci-free-tier-arm-linux
          chmod +x bin/oci-free-tier-arm-linux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/oci-free-tier-arm-linux
          if git diff --cached --quiet; then
            echo "binary unchanged — nothing to commit"
          else
            git commit -m "build: commit Linux release binary"
            git push
          fi
